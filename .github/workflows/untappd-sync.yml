name: Untappd Sync

on:
  schedule:
    - cron: '50 21 * * *'   # 21:50 UTC = 22:50 BST (UTC+1) / 21:50 GMT (UTC+0)
  workflow_dispatch:         # allow manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # needed by the keepalive step below
    steps:
      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling via the API on each run resets that timer.
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/untappd-sync.yml/enable"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Install Playwright Chromium
        working-directory: scripts
        run: npx playwright install chromium --with-deps

      - name: Run sync
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node untappd-sync.mjs
